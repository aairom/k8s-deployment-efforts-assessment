[defaults]
# Répertoire de l'inventaire par défaut
inventory          = inventory/iks.yml

# Répertoire des rôles
roles_path         = roles

# Désactiver la vérification de la clé hôte SSH (les connexions sont locales)
host_key_checking  = False

# Format de sortie lisible
stdout_callback    = yaml

# Collecte des faits désactivée par défaut (connexion locale)
gathering          = explicit

# Nombre de forks parallèles
forks              = 10

# Fichier de log
log_path           = /tmp/ansible-hello-operator.log

# Activer les couleurs
force_color        = True

# Répertoire des collections (si ansible-galaxy utilisé)
collections_path   = ~/.ansible/collections

# Timeout de connexion
timeout            = 30

[privilege_escalation]
become             = False

[ssh_connection]
# Options SSH pour les connexions distantes (non utilisées ici en mode local)
ssh_args           = -o ControlMaster=auto -o ControlPersist=60s
pipelining         = True
