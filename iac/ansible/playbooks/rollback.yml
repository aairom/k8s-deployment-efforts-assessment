---
# playbooks/rollback.yml
# Revient à la révision précédente du déploiement de l'opérateur.
#
# Usage:
#   ansible-playbook playbooks/rollback.yml \
#     -i inventory/<platform>.yml \
#     -e target_platform=gke

- name: "Rollback du hello-operator"
  hosts: "{{ target_platform }}"
  gather_facts: false
  vars:
    target_platform: "iks"

  pre_tasks:
    - name: "Validation — target_platform fourni"
      ansible.builtin.assert:
        that:
          - target_platform is defined
          - target_platform in ['iks', 'roks', 'eks', 'aks', 'gke']
        fail_msg: "target_platform doit être l'un de: iks, roks, eks, aks, gke"

  roles:
    - role: common

  tasks:
    - name: "Inclure les tâches de rollback"
      ansible.builtin.include_tasks:
        file: "../roles/lifecycle/tasks/rollback.yml"

  post_tasks:
    - name: "Validation post-rollback"
      ansible.builtin.include_role:
        name: validate
