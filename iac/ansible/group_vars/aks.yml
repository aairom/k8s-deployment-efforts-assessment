---
# group_vars/aks.yml — Variables spécifiques à Azure AKS

# ── Authentification Azure ────────────────────────────────────────────────────
azure_subscription_id: "{{ lookup('env', 'ARM_SUBSCRIPTION_ID') }}"
azure_resource_group: "hello-operator-aks-rg"
azure_location: "westeurope"

# ── Cluster AKS ───────────────────────────────────────────────────────────────
cluster_name: "hello-operator-aks-prod"
kubeconfig_path: "~/.kube/config-aks-hello-operator"
kubectl_context: "hello-operator-aks-prod"
kubectl_binary: "kubectl"

# ── Opérateur ─────────────────────────────────────────────────────────────────
operator_namespace: "hello-operator-system"
operator_image_repository: "helloacr.azurecr.io/hello-operator"
operator_image_tag: "v0.1.0"
operator_replicas: 2

# ── Manifests ─────────────────────────────────────────────────────────────────
manifests_base_dir: "{{ playbook_dir }}/../../../hello-operator/config"
crd_manifest: "{{ manifests_base_dir }}/crd/bases/apps.example.com_helloworlds.yaml"
rbac_manifests_dir: "{{ manifests_base_dir }}/rbac"
manager_manifest: "{{ manifests_base_dir }}/manager/manager.yaml"

# ── HelloWorld CR ─────────────────────────────────────────────────────────────
helloworld_cr_name: "helloworld-sample"
helloworld_replicas: 2
helloworld_message: "Bonjour depuis AKS!"

# ── Helm ──────────────────────────────────────────────────────────────────────
helm_chart_path: "{{ playbook_dir }}/../../../hello-operator/chart"
helm_release_name: "hello-operator"
helm_chart_version: ""

# ── Validation ────────────────────────────────────────────────────────────────
validation_timeout: 120
validation_poll_interval: 10
