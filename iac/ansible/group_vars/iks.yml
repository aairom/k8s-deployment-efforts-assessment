---
# group_vars/iks.yml — Variables spécifiques à IBM Kubernetes Service

# ── Authentification IBM Cloud ────────────────────────────────────────────────
ibmcloud_api_key: "{{ lookup('env', 'IBMCLOUD_API_KEY') }}"
ibmcloud_region: "eu-de"
ibmcloud_resource_group: "hello-operator-rg"

# ── Cluster IKS ───────────────────────────────────────────────────────────────
cluster_name: "hello-operator-iks-prod"
kubeconfig_path: "~/.kube/config-iks-hello-operator"
kubectl_context: "hello-operator-iks-prod/{{ cluster_name }}"

# ── Opérateur ─────────────────────────────────────────────────────────────────
operator_namespace: "hello-operator-system"
operator_image_repository: "icr.io/hello-operator/hello-operator"
operator_image_tag: "v0.1.0"
operator_replicas: 2

# ── Manifests ─────────────────────────────────────────────────────────────────
manifests_base_dir: "{{ playbook_dir }}/../../../hello-operator/config"
crd_manifest: "{{ manifests_base_dir }}/crd/bases/apps.example.com_helloworlds.yaml"
rbac_manifests_dir: "{{ manifests_base_dir }}/rbac"
manager_manifest: "{{ manifests_base_dir }}/manager/manager.yaml"

# ── HelloWorld CR ─────────────────────────────────────────────────────────────
helloworld_cr_name: "helloworld-sample"
helloworld_replicas: 2
helloworld_message: "Bonjour depuis IKS!"

# ── Helm ──────────────────────────────────────────────────────────────────────
helm_chart_path: "{{ playbook_dir }}/../../../hello-operator/chart"
helm_release_name: "hello-operator"
helm_chart_version: ""

# ── Validation ────────────────────────────────────────────────────────────────
validation_timeout: 120
validation_poll_interval: 10
