apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hello-operator-system

namePrefix: ""

labels:
  - pairs:
      app.kubernetes.io/part-of: hello-operator
    includeSelectors: false

resources:
  - ../crd
  - ../rbac
  - ../manager

# Images is a list that can be updated by `kustomize edit set image`.
# `make deploy` calls: kustomize edit set image controller=${IMG}
images:
  - name: controller
    newName: controller
    newTag: latest
