# =============================================================================
# HORIZONTAL POD AUTOSCALER — ROKS (Red Hat OpenShift on IBM Cloud)
# Platform: ROKS — OpenShift 4.x on IBM Cloud VPC
# Apply with: oc apply -f hpa.yaml
#
# ROKS supports HPA v2 identically to upstream Kubernetes.
# The OpenShift MachineAutoscaler (not configured here) can automatically
# add new VPC worker nodes when HPA exhausts existing node capacity.
#
# To enable cluster-level autoscaling on ROKS:
#   oc edit MachineAutoscaler -n openshift-machine-api
# or create MachineAutoscaler CRs for each MachineSet.
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: myapp-hpa
  namespace: myapp
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: myapp
  minReplicas: 3   # One per VPC zone for HA
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
