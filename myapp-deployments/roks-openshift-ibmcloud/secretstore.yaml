# =============================================================================
# SecretStore — myapp-ibm-secretsmanager  (ROKS on IBM Cloud)
# =============================================================================
# Configures ESO to read secrets from IBM Secrets Manager.
# Uses an IBM Cloud API key stored in a bootstrap Kubernetes Secret that is
# created ONCE by the platform operator — never committed to Git:
#
#   oc create secret generic secret-ibm-api-key \
#     --from-literal=apiKey=<IBM_CLOUD_API_KEY> \
#     -n myapp
#
# On ROKS the recommended alternative is the IBM Secrets Manager Operator
# available on OperatorHub (Red Hat Marketplace). The ESO approach is used
# here for parity with the IKS deployment.
#
# Prerequisites:
#   1. ESO installed via OperatorHub or Helm (see README-secrets.md)
#   2. IBM Secrets Manager instance provisioned (us-south or your region)
#   3. Service ID with "SecretsReader" role on the instance
#   4. IBM Cloud API key for that Service ID
#
# Replace <SECRETS_MANAGER_INSTANCE_GUID> below with the actual instance GUID:
#   ibmcloud resource service-instance myapp-secrets-manager --id
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: myapp-ibm-secretsmanager
  namespace: myapp
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/component: secret-store
    platform: roks-openshift-ibmcloud
  annotations:
    # On ROKS, ESO can also be installed via OperatorHub:
    # operators.coreos.com/external-secrets-operator.myapp: ""
spec:
  provider:
    ibm:
      serviceUrl: "https://<SECRETS_MANAGER_INSTANCE_GUID>.us-south.secrets-manager.appdomain.cloud/api/v2"
      auth:
        secretRef:
          # Bootstrap Secret with the IBM Cloud API key — operator-created, never in Git
          secretApiKeySecretRef:
            name: secret-ibm-api-key
            key: apiKey
            namespace: myapp
