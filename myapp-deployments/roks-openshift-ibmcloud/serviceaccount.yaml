# =============================================================================
# SERVICE ACCOUNT — ROKS (Red Hat OpenShift on IBM Cloud)
# Platform: ROKS — OpenShift 4.x on IBM Cloud VPC
# Apply with: oc apply -f serviceaccount.yaml
#
# On OpenShift, ServiceAccounts are associated with Security Context Constraints
# (SCCs) via RoleBinding. By default, pods run under the 'restricted-v2' SCC
# which disallows running as root and drops all Linux capabilities.
#
# If your application requires elevated privileges (e.g., specific UID/GID),
# you must explicitly bind the ServiceAccount to the appropriate SCC.
# See the RoleBinding at the bottom of this file.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: myapp-sa
  namespace: myapp
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/component: backend
  annotations:
    # IBM Cloud Trusted Profile integration (ROKS 4.11+):
    # Allows pods to assume an IBM Cloud IAM Trusted Profile without an API key.
    # ibm-cloud.kubernetes.io/trusted-profile-id: "<TRUSTED_PROFILE_ID>"
    description: "Service account for MyApp — bound to restricted-v2 SCC on OpenShift"

---
# =============================================================================
# ROLE BINDING — Grant the myapp-sa ServiceAccount the ability to use
# the 'restricted-v2' SCC (default, non-root, most secure).
#
# If your app MUST run as a specific UID (e.g., UID 1001), add:
#   oc adm policy add-scc-to-user anyuid -z myapp-sa -n myapp
# or bind to 'nonroot-v2' SCC for non-root flexibility:
#   oc adm policy add-scc-to-user nonroot-v2 -z myapp-sa -n myapp
#
# IMPORTANT: Never use 'anyuid' or 'privileged' SCCs in production
# unless your application strictly requires it and has been security-reviewed.
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: myapp-sa-restricted-v2
  namespace: myapp
  labels:
    app.kubernetes.io/name: myapp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # 'system:openshift:scc:restricted-v2' is the OpenShift cluster role that
  # grants permission to use the restricted-v2 SCC.
  name: system:openshift:scc:restricted-v2
subjects:
  - kind: ServiceAccount
    name: myapp-sa
    namespace: myapp
