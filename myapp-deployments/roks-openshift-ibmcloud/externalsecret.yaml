# =============================================================================
# ExternalSecret — myapp-externalsecret  (ROKS on IBM Cloud)
# =============================================================================
# Instructs ESO to pull credentials from IBM Secrets Manager and synthesize
# the Kubernetes Secret "myapp-secret" in the myapp namespace.
#
# On ROKS, OpenShift's SCC (restricted-v2) restricts pod capabilities but
# does not affect how ESO reads external secrets — ESO runs as a separate
# controller pod under its own SCC.
#
# Expected IBM Secrets Manager secrets (arbitrary type):
#   Secret group : myapp-production
#   myapp/db-password       → DB_PASSWORD
#   myapp/ibm-cloud-api-key → IBM_CLOUD_API_KEY
#   myapp/jwt-secret        → JWT_SECRET
#
# Create them before deploying (IBM Cloud CLI):
#   ibmcloud secrets-manager secret-create \
#     --secret-type arbitrary \
#     --secret-name "myapp/db-password" \
#     --secret-payload "<YOUR_DB_PASSWORD>"
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: myapp-externalsecret
  namespace: myapp
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/component: external-secret
    platform: roks-openshift-ibmcloud
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: myapp-ibm-secretsmanager
    kind: SecretStore

  target:
    name: myapp-secret
    namespace: myapp
    creationPolicy: Owner
    deletionPolicy: Retain

  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: myapp/db-password

    - secretKey: IBM_CLOUD_API_KEY
      remoteRef:
        key: myapp/ibm-cloud-api-key

    - secretKey: JWT_SECRET
      remoteRef:
        key: myapp/jwt-secret
