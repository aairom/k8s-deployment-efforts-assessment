# =============================================================================
# CONFIGMAP — ROKS (Red Hat OpenShift on IBM Cloud)
# Platform: ROKS — OpenShift 4.x on IBM Cloud VPC
# Apply with: oc apply -f configmap.yaml
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: myapp-config
  namespace: myapp
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/component: backend
data:
  APP_ENV: "production"
  APP_PORT: "8080"
  APP_LOG_LEVEL: "info"
  APP_MAX_CONNECTIONS: "100"

  # IBM Cloud region
  IBM_CLOUD_REGION: "us-south"
  IBM_CLOUD_RESOURCE_GROUP: "myapp-rg"

  # IBM Cloud Object Storage — private endpoint
  COS_ENDPOINT: "https://s3.private.us-south.cloud-object-storage.appdomain.cloud"
  COS_BUCKET: "myapp-data-bucket"

  # Database connection (non-sensitive)
  DB_HOST: "myapp-db.private.us-south.databases.appdomain.cloud"
  DB_PORT: "5432"
  DB_NAME: "myapp_production"

  # OpenShift-specific: internal image registry service URL
  # Useful if the app needs to reference its own image programmatically
  OPENSHIFT_IMAGE_REGISTRY: "image-registry.openshift-image-registry.svc:5000"

  # OpenShift cluster console URL — useful for generating deep-link URLs
  # Replace with your actual cluster console URL
  OCP_CONSOLE_URL: "https://console-openshift-console.apps.<CLUSTER_DOMAIN>"
