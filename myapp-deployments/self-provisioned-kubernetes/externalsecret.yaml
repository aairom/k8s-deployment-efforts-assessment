# =============================================================================
# ExternalSecret — myapp-externalsecret  (Strategy B — ESO + HashiCorp Vault)
# Self-Provisioned Kubernetes
# =============================================================================
# Instructs ESO to pull credentials from HashiCorp Vault (KV v2) and
# synthesize the Kubernetes Secret "myapp-secret" in the myapp namespace.
#
# Expected Vault secret layout (KV v2 at path secret/myapp/production):
#   vault kv put secret/myapp/production \
#     DB_PASSWORD="<strong-password>" \
#     APP_API_KEY="<random-api-key>" \
#     JWT_SECRET="<random-jwt-secret>" \
#     REGISTRY_TOKEN="<harbor-or-quay-robot-token>"
#
# Create the Vault secret before deploying:
#   export VAULT_ADDR=http://<VAULT_ADDRESS>:8200
#   vault login   # or: vault login -method=kubernetes
#   vault kv put secret/myapp/production \
#     DB_PASSWORD="$(openssl rand -base64 24)" \
#     APP_API_KEY="$(openssl rand -hex 32)" \
#     JWT_SECRET="$(openssl rand -base64 48)" \
#     REGISTRY_TOKEN="<robot-token-from-harbor-quay>"
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: myapp-externalsecret
  namespace: myapp
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/component: external-secret
    platform: self-provisioned-kubernetes
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: myapp-vault
    kind: SecretStore

  target:
    name: myapp-secret
    namespace: myapp
    creationPolicy: Owner
    deletionPolicy: Retain

  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: myapp/production
        property: DB_PASSWORD

    - secretKey: APP_API_KEY
      remoteRef:
        key: myapp/production
        property: APP_API_KEY

    - secretKey: JWT_SECRET
      remoteRef:
        key: myapp/production
        property: JWT_SECRET

    - secretKey: REGISTRY_TOKEN
      remoteRef:
        key: myapp/production
        property: REGISTRY_TOKEN
