# =============================================================================
# HORIZONTAL POD AUTOSCALER — Self-Provisioned Kubernetes
# Platform: Kubernetes installed on bare VMs (on-prem or cloud IaaS)
# Apply with: kubectl apply -f hpa.yaml
#
# PREREQUISITES:
#   HPA requires the Kubernetes Metrics Server to be installed.
#   On a self-provisioned cluster it is NOT installed by default.
#
#   Install Metrics Server:
#     kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
#   For on-premises clusters with self-signed TLS, add:
#     --kubelet-insecure-tls flag to the metrics-server deployment args
#
#   Verify Metrics Server is working:
#     kubectl top nodes
#     kubectl top pods -n myapp
#
# NOTE: The Cluster Autoscaler (CA) requires cloud-provider credentials to
# provision new nodes. For bare-metal, use Cluster API with a provider like
# MAAS or vSphere. For self-managed cloud VMs, use the cloud-specific CA:
#   AWS:   https://github.com/kubernetes/autoscaler/blob/master/cluster-autoscaler/cloudprovider/aws/README.md
#   GCP:   https://github.com/kubernetes/autoscaler/blob/master/cluster-autoscaler/cloudprovider/gce/README.md
#   Azure: https://github.com/kubernetes/autoscaler/blob/master/cluster-autoscaler/cloudprovider/azure/README.md
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: myapp-hpa
  namespace: myapp
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: myapp
  minReplicas: 2   # Lower minimum for self-provisioned — adjust to node capacity
  maxReplicas: 8   # Adjust to your cluster's available worker node capacity

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
