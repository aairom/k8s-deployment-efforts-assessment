# =============================================================================
# SecretStore — myapp-vault  (Strategy B — ESO + HashiCorp Vault)
# Self-Provisioned Kubernetes
# =============================================================================
# Configures ESO to read secrets from a self-hosted HashiCorp Vault instance
# using Kubernetes auth (the pod's ServiceAccount token is exchanged for a
# Vault token — no static credentials required).
#
# Prerequisites:
#   1. HashiCorp Vault deployed and unsealed (e.g. helm install vault hashicorp/vault)
#   2. Kubernetes auth method enabled in Vault:
#        vault auth enable kubernetes
#        vault write auth/kubernetes/config \
#          kubernetes_host="https://$KUBERNETES_PORT_443_TCP_ADDR:443"
#   3. A Vault policy and role granting read access to myapp/production/* :
#        vault policy write myapp-read - <<EOF
#        path "secret/data/myapp/production" { capabilities = ["read"] }
#        EOF
#        vault write auth/kubernetes/role/myapp-eso \
#          bound_service_account_names=external-secrets-sa \
#          bound_service_account_namespaces=myapp \
#          policies=myapp-read \
#          ttl=1h
#   4. ESO installed (see README-secrets.md)
#
# Replace <VAULT_ADDRESS> with your Vault server address (e.g. http://vault.vault.svc:8200)
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: myapp-vault
  namespace: myapp
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/component: secret-store
    platform: self-provisioned-kubernetes
spec:
  provider:
    vault:
      server: "http://<VAULT_ADDRESS>:8200"
      # KV v2 secrets engine path (default: secret)
      path: "secret"
      version: "v2"
      auth:
        # Kubernetes auth — the ESO controller SA token is exchanged for a Vault token
        kubernetes:
          mountPath: "kubernetes"
          role: "myapp-eso"
          serviceAccountRef:
            name: external-secrets-sa
            namespace: myapp
