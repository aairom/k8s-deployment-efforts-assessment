# Secret — myapp-secret  (EMPTY SENTINEL — Self-Provisioned Kubernetes)
# =============================================================================
# ⛔ THIS FILE INTENTIONALLY CONTAINS NO SECRET DATA.
#
# Secrets for the self-provisioned cluster are managed via ONE of two
# strategies (choose based on your infrastructure):
#
#   Strategy A — Sealed Secrets (Bitnami kubeseal)
#     The committed file is: sealed-secret.yaml
#     An operator generates it with kubeseal from a .env file that is
#     NEVER committed to Git.
#
#   Strategy B — External Secrets Operator + HashiCorp Vault
#     The committed files are: secretstore.yaml + externalsecret.yaml
#     Vault holds the real values; ESO synthesizes the K8s Secret at runtime.
#
# See README-secrets.md for full instructions on both strategies.
# DO NOT add base64 values to this file.
# =============================================================================
