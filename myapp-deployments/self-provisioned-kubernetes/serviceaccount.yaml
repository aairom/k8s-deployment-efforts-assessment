# =============================================================================
# SERVICE ACCOUNT — Self-Provisioned Kubernetes
# Platform: Kubernetes installed on bare VMs (on-prem or cloud IaaS)
# Apply with: kubectl apply -f serviceaccount.yaml
#
# ADAPTATION NOTES:
#   - No cloud IAM binding is possible without a cloud-provider integration.
#   - For secret injection, consider:
#       * HashiCorp Vault Agent Injector (sidecar)
#       * External Secrets Operator with a supported backend
#       * Sealed Secrets (Bitnami) for GitOps workflows
#   - For workload identity (AWS, GCP, Azure, IBM Cloud), use the respective
#     IRSA, Workload Identity, or Pod Identity webhook specific to your cloud.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: myapp-sa
  namespace: myapp
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/component: backend
  annotations:
    description: "Service account for MyApp — self-provisioned Kubernetes cluster"
    # HashiCorp Vault Agent Injector annotation (uncomment if using Vault):
    # vault.hashicorp.com/agent-inject: "true"
    # vault.hashicorp.com/role: "myapp"
    # vault.hashicorp.com/agent-inject-secret-db-password: "secret/myapp/db"

---
# =============================================================================
# Restrict permissions: deny the default ServiceAccount from accessing the
# Kubernetes API (principle of least privilege). This is a cluster-wide
# best practice for production clusters.
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: myapp-sa-readonly
  namespace: myapp
  labels:
    app.kubernetes.io/name: myapp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # view = read-only access to most resources within the namespace
  # Replace with a custom Role if stricter RBAC is needed
  name: view
subjects:
  - kind: ServiceAccount
    name: myapp-sa
    namespace: myapp
