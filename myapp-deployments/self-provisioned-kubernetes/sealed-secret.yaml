# =============================================================================
# SealedSecret — myapp-secret  (Strategy A — Bitnami Sealed Secrets)
# =============================================================================
# THIS IS A STUB / TEMPLATE FILE.
#
# ⛔ DO NOT EDIT THE encryptedData VALUES MANUALLY.
#    They must be generated by kubeseal using the cluster's public key.
#
# Workflow to generate a valid SealedSecret:
# -----------------------------------------------------------------
# 1. Create a local plain Secret from your .env file (never committed):
#
#    kubectl create secret generic myapp-secret \
#      --from-env-file=.env \
#      --namespace myapp \
#      --dry-run=client \
#      -o yaml > /tmp/myapp-secret-plain.yaml
#
# 2. Seal it with the cluster's public key:
#
#    kubeseal \
#      --controller-name=sealed-secrets-controller \
#      --controller-namespace=kube-system \
#      --format yaml \
#      < /tmp/myapp-secret-plain.yaml \
#      > sealed-secret.yaml
#
# 3. Commit sealed-secret.yaml — it is safe to commit.
#    The Sealed Secrets controller decrypts it at runtime using
#    the cluster-side private key, creating the plain K8s Secret.
#
# 4. Delete the plaintext file:
#    rm /tmp/myapp-secret-plain.yaml
#
# Prerequisites:
#   brew install kubeseal  (or download from GitHub releases)
#   Sealed Secrets controller installed in kube-system:
#     helm install sealed-secrets sealed-secrets/sealed-secrets \
#       -n kube-system \
#       --set fullnameOverride=sealed-secrets-controller
# =============================================================================
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: myapp-secret
  namespace: myapp
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/component: sealed-secret
  annotations:
    # Namespace-scoped sealing — the sealed secret can only be decrypted
    # by the controller in the myapp namespace of THIS specific cluster.
    sealedsecrets.bitnami.com/namespace-wide: "false"
    sealedsecrets.bitnami.com/cluster-wide: "false"
spec:
  # ── PLACEHOLDER VALUES ─────────────────────────────────────────────────────
  # These are NOT real encrypted values.
  # Replace the entire encryptedData block by running kubeseal as above.
  # The placeholder strings below will cause the controller to fail — that is
  # intentional: it forces the operator to run kubeseal before deploying.
  encryptedData:
    DB_PASSWORD:     "REPLACE_WITH_KUBESEAL_OUTPUT"
    APP_API_KEY:     "REPLACE_WITH_KUBESEAL_OUTPUT"
    JWT_SECRET:      "REPLACE_WITH_KUBESEAL_OUTPUT"
    REGISTRY_TOKEN:  "REPLACE_WITH_KUBESEAL_OUTPUT"
  template:
    metadata:
      name: myapp-secret
      namespace: myapp
    type: Opaque
