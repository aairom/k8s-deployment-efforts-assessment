# =============================================================================
# ExternalSecret — myapp-externalsecret  (IKS on IBM Cloud VPC)
# =============================================================================
# Instructs ESO to pull credentials from IBM Secrets Manager and create the
# Kubernetes Secret "myapp-secret" in the myapp namespace.
#
# Expected IBM Secrets Manager secrets (type: arbitrary / key-value):
#   Secret group : myapp-production
#   Secret name  : myapp/db-password       → DB_PASSWORD
#   Secret name  : myapp/ibm-cloud-api-key → IBM_CLOUD_API_KEY
#   Secret name  : myapp/jwt-secret        → JWT_SECRET
#
# Create them with the IBM Cloud CLI before deploying:
#   ibmcloud secrets-manager secret-create \
#     --secret-type arbitrary \
#     --secret-name "myapp/db-password" \
#     --secret-payload "<YOUR_DB_PASSWORD>" \
#     --secret-group-id <GROUP_ID>
#
# Or via the IBM Cloud Console:
#   Secrets Manager → Secrets → Create secret → Arbitrary
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: myapp-externalsecret
  namespace: myapp
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/component: external-secret
    platform: iks-vpc-ibmcloud
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: myapp-ibm-secretsmanager
    kind: SecretStore

  target:
    name: myapp-secret
    namespace: myapp
    creationPolicy: Owner
    deletionPolicy: Retain

  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        # IBM Secrets Manager secret name (arbitrary type)
        key: myapp/db-password

    - secretKey: IBM_CLOUD_API_KEY
      remoteRef:
        key: myapp/ibm-cloud-api-key

    - secretKey: JWT_SECRET
      remoteRef:
        key: myapp/jwt-secret
