# =============================================================================
# KUSTOMIZATION — IKS on IBM Cloud VPC
# Apply the full stack with: kubectl apply -k .
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: myapp

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  # Secret management — ESO SecretStore + ExternalSecret (no hardcoded values)
  # ESO synthesizes the live myapp-secret K8s Secret from IBM Secrets Manager.
  - secretstore.yaml
  - externalsecret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

commonLabels:
  platform: iks-vpc-ibmcloud
  app.kubernetes.io/part-of: myapp
