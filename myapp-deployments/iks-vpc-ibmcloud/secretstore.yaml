# =============================================================================
# SecretStore — myapp-ibm-secretsmanager  (IKS on IBM Cloud VPC)
# =============================================================================
# Configures ESO to read secrets from IBM Secrets Manager using an IBM Cloud
# API key stored in a bootstrap Kubernetes Secret (secret-ibm-api-key).
#
# The bootstrap Secret must be created ONCE by the platform operator
# before the first deployment — it is never committed to Git:
#
#   kubectl create secret generic secret-ibm-api-key \
#     --from-literal=apiKey=<IBM_CLOUD_API_KEY> \
#     -n myapp
#
# Prerequisites:
#   1. ESO installed (see README-secrets.md)
#   2. IBM Secrets Manager instance provisioned in us-south
#   3. Service ID with "SecretsReader" role on the Secrets Manager instance
#   4. IBM Cloud API key for that Service ID
#
# Replace <SECRETS_MANAGER_INSTANCE_GUID> with the actual instance GUID from:
#   ibmcloud resource service-instance myapp-secrets-manager --id
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: myapp-ibm-secretsmanager
  namespace: myapp
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/component: secret-store
    platform: iks-vpc-ibmcloud
spec:
  provider:
    ibm:
      serviceUrl: "https://<SECRETS_MANAGER_INSTANCE_GUID>.us-south.secrets-manager.appdomain.cloud/api/v2"
      auth:
        secretRef:
          # Bootstrap Secret containing the IBM Cloud API key.
          # Created manually by the operator — NEVER committed to Git.
          secretApiKeySecretRef:
            name: secret-ibm-api-key
            key: apiKey
            namespace: myapp
