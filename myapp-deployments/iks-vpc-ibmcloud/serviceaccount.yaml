# =============================================================================
# SERVICE ACCOUNT — IKS on IBM Cloud VPC
# Platform: IBM Kubernetes Service (IKS) — VPC Gen2 infrastructure
# Apply with: kubectl apply -f serviceaccount.yaml
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: myapp-sa
  namespace: myapp
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/component: backend
  annotations:
    # IBM Cloud IAM: bind this ServiceAccount to an IBM Cloud Service ID
    # to grant fine-grained access to IBM Cloud services (COS, Key Protect, etc.)
    # Replace <SERVICE_ID_CRN> with the CRN of your IBM Cloud Service ID.
    # ibm-cloud.kubernetes.io/service-id: "<SERVICE_ID_CRN>"
    #
    # IBM Trusted Profile integration (IKS 1.26+):
    # ibm-cloud.kubernetes.io/trusted-profile-id: "<TRUSTED_PROFILE_ID>"
    description: "Service account for MyApp — grants IBM Cloud IAM-based access"
