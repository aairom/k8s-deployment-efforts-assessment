# =============================================================================
# ExternalSecret — myapp-externalsecret
# =============================================================================
# Instructs the External Secrets Operator to fetch values from AWS Secrets
# Manager and synthesize a Kubernetes Secret named "myapp-secret" in the
# myapp namespace.
#
# Expected AWS Secrets Manager secret layout (JSON, path: myapp/production):
# {
#   "DB_HOST":        "db.prod.us-east-1.rds.amazonaws.com",
#   "DB_NAME":        "myapp_db",
#   "DB_USER":        "myapp_user",
#   "DB_PASSWORD":    "<strong-password>",
#   "API_SECRET_KEY": "<32-char-random-hex>",
#   "JWT_SECRET":     "<64-char-random-string>"
# }
#
# Create the secret in AWS before deploying:
#   aws secretsmanager create-secret \
#     --name myapp/production \
#     --region us-east-1 \
#     --secret-string '{
#       "DB_HOST":        "db.prod.us-east-1.rds.amazonaws.com",
#       "DB_NAME":        "myapp_db",
#       "DB_USER":        "myapp_user",
#       "DB_PASSWORD":    "<YOUR_REAL_PASSWORD>",
#       "API_SECRET_KEY": "<YOUR_REAL_API_KEY>",
#       "JWT_SECRET":     "<YOUR_REAL_JWT_SECRET>"
#     }'
#
# ESO will reconcile this every 1 hour (refreshInterval below).
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: myapp-externalsecret
  namespace: myapp
  labels:
    app: myapp
    app.kubernetes.io/component: external-secret
spec:
  # How often ESO re-fetches from AWS Secrets Manager and updates the K8s Secret
  refreshInterval: 1h

  # Reference to the SecretStore that defines the AWS Secrets Manager backend
  secretStoreRef:
    name: myapp-aws-secretsmanager
    kind: SecretStore

  # The Kubernetes Secret that ESO will create / keep in sync
  target:
    name: myapp-secret
    namespace: myapp
    # If the K8s Secret already exists from a previous deploy, ESO will
    # update it. Set creationPolicy to Owner so ESO owns the lifecycle.
    creationPolicy: Owner
    # ESO will delete the K8s Secret when the ExternalSecret is deleted
    deletionPolicy: Retain

  # Map each JSON key from the AWS secret to a key in the K8s Secret
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: myapp/production
        property: DB_HOST

    - secretKey: DB_NAME
      remoteRef:
        key: myapp/production
        property: DB_NAME

    - secretKey: DB_USER
      remoteRef:
        key: myapp/production
        property: DB_USER

    - secretKey: DB_PASSWORD
      remoteRef:
        key: myapp/production
        property: DB_PASSWORD

    - secretKey: API_SECRET_KEY
      remoteRef:
        key: myapp/production
        property: API_SECRET_KEY

    - secretKey: JWT_SECRET
      remoteRef:
        key: myapp/production
        property: JWT_SECRET
