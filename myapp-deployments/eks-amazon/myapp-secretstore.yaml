# =============================================================================
# SecretStore — myapp-aws-secretsmanager
# =============================================================================
# Configures the External Secrets Operator (ESO) backend to read secrets
# from AWS Secrets Manager in the same region as the EKS cluster.
#
# Authentication: IRSA (IAM Roles for Service Accounts)
#   The ESO controller pod uses its own dedicated ServiceAccount annotated
#   with an IAM Role ARN that has secretsmanager:GetSecretValue permission.
#
# Prerequisites:
#   1. ESO installed:
#        helm repo add external-secrets https://charts.external-secrets.io
#        helm install external-secrets external-secrets/external-secrets \
#          -n external-secrets-system --create-namespace \
#          --set installCRDs=true
#   2. An IAM Role for ESO with policy:
#        {
#          "Effect": "Allow",
#          "Action": ["secretsmanager:GetSecretValue","secretsmanager:DescribeSecret"],
#          "Resource": "arn:aws:secretsmanager:us-east-1:123456789012:secret:myapp/*"
#        }
#   3. Replace the roleArn below with the real ESO IAM Role ARN.
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: myapp-aws-secretsmanager
  namespace: myapp
  labels:
    app: myapp
    app.kubernetes.io/component: secret-store
spec:
  provider:
    aws:
      service: SecretsManager
      # AWS region where the secrets are stored
      region: us-east-1
      auth:
        # Use IRSA: ESO assumes this IAM Role via the cluster OIDC provider
        jwt:
          serviceAccountRef:
            # This ServiceAccount must have the eks.amazonaws.com/role-arn annotation
            # pointing to the ESO IAM Role (separate from the myapp-sa app role)
            name: external-secrets-sa
            namespace: myapp
