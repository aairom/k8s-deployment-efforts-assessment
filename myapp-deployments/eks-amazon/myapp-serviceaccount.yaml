# =============================================================================
# ServiceAccount — myapp-sa
# =============================================================================
# Dedicated ServiceAccount for MyApp pods.
#
# IRSA (IAM Roles for Service Accounts) — EKS-native IAM integration
# -----------------------------------------------------------------------
# The annotation below binds this ServiceAccount to an AWS IAM Role via
# the EKS OIDC provider. Pods using this SA automatically receive short-lived
# AWS credentials injected by the EKS Pod Identity webhook, with no need for
# long-lived access keys.
#
# Prerequisites:
#   1. An OIDC provider must be associated with the EKS cluster.
#   2. The IAM role trust policy must reference the cluster OIDC issuer and
#      this ServiceAccount (namespace + name).
#
# Replace the ARN below with the actual IAM role ARN created for MyApp.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: myapp-sa
  namespace: myapp
  labels:
    app: myapp
    app.kubernetes.io/name: myapp
    app.kubernetes.io/component: serviceaccount
    version: v1
  annotations:
    # IRSA annotation — binds this ServiceAccount to an AWS IAM Role
    # Replace with the real role ARN provisioned by your platform team
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/myapp-eks-irsa-role"

    # Optional: restrict token audience (defaults to "sts.amazonaws.com")
    eks.amazonaws.com/audience: "sts.amazonaws.com"

    # Optional: set token expiration (in seconds). Default: 86400 (24h)
    eks.amazonaws.com/token-expiration: "86400"

# Prevent automatic mounting of the default ServiceAccount token on pods
# that do not explicitly request it — reduces attack surface.
automountServiceAccountToken: false
